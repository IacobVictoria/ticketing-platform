server:
  port: 8081
spring:
  application:
    name: platform
  # locally: Mailpit from infra/compose.yaml (inbox at http://localhost:8025)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # in milliseconds; without them a mail server that stops answering would block forever
    properties:
      "mail.smtp.connectiontimeout": 5000
      "mail.smtp.timeout": 5000
      "mail.smtp.writetimeout": 5000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: app
    password: secret
    hikari:
      data-source-properties:
        # the driver sends a JDBC batch of INSERTs as one multi-row INSERT; without it batch_size barely helps
        reWriteBatchedInserts: true
  web:
    resources:
      add-mappings: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
management:
  health:
    mail:
      # the app works without the mail server (users can ask for the email again),
      # so a stopped Mailpit must not turn /actuator/health DOWN
      enabled: false
app:
  # used to build links in emails (the verification page lives in the Angular app)
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail-from: "Ticketing <no-reply@ticketing.local>"
  jwt:
    issuer: ticketing-platform
    # local default only; any real environment sets JWT_SECRET (at least 32 bytes)
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    # short: an access token cannot be revoked, it only expires
    ttl: 15m
  refresh-token:
    ttl: 7d
    reuse-grace: 30s
    cookie-secure: true
    # second minute hour day month weekday: every night at 03:00
    cleanup-cron: "0 0 3 * * *"
  admin:
    # created at startup only if no admin exists yet; the defaults are for local use only,
    # any shared environment (Docker demo, production) must set ADMIN_EMAIL and ADMIN_PASSWORD
    email: ${ADMIN_EMAIL:admin@ticketing.local}
    password: ${ADMIN_PASSWORD:admin-local-password}