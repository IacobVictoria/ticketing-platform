server:
  port: 8081
spring:
  application:
    name: platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: app
    password: secret
    hikari:
      data-source-properties:
        # the driver sends a JDBC batch of INSERTs as one multi-row INSERT; without it batch_size barely helps
        reWriteBatchedInserts: true
  web:
    resources:
      add-mappings: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
app:
  jwt:
    issuer: ticketing-platform
    # local default only; any real environment sets JWT_SECRET (at least 32 bytes)
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    ttl: 1h